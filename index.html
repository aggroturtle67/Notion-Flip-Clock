<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine Flip-Uhr</title>

  <style>
    :root {
      --panel-top: #70889a;
      --panel-bottom: #617887;
      --digits: #ffffff;
      --caramel: #bd885d;
      --shadow: rgba(0, 0, 0, 0.34);
      --hinge: rgba(24, 29, 34, 0.62);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
    }

    .widget {
      width: min(100%, 560px);
      padding: clamp(12px, 4vw, 28px);
      text-align: center;
    }

    .clock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(3px, 1vw, 6px);
      perspective: 900px;
    }

    .flip-card {
      position: relative;
      display: flex;
      flex-direction: column;
      width: clamp(112px, 34vw, 190px);
      height: 1.16em;
      color: var(--digits);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(72px, 22vw, 124px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.055em;
      line-height: 1;
      text-shadow: 0 2px 1px rgba(0, 0, 0, 0.16);
      filter: drop-shadow(0 10px 15px var(--shadow));
    }

    .top,
    .bottom,
    .top-flip,
    .bottom-flip {
      position: absolute;
      left: 0;
      display: flex;
      justify-content: center;
      width: 100%;
      height: 0.58em;
      padding-right: 0.055em;
      overflow: hidden;
      backface-visibility: hidden;
    }

    .top,
    .top-flip {
      top: 0;
      align-items: flex-start;
      background: linear-gradient(
        180deg,
        #7891a3 0%,
        var(--panel-top) 100%
      );
      border-radius: 15px 15px 4px 4px;
      border-bottom: 1px solid var(--hinge);
    }

    .bottom,
    .bottom-flip {
      bottom: 0;
      align-items: flex-end;
      background: linear-gradient(
        180deg,
        var(--panel-bottom) 0%,
        #5b707e 100%
      );
      border-radius: 4px 4px 15px 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .top-flip {
      z-index: 2;
      transform-origin: bottom;
      animation: fold-up 280ms cubic-bezier(0.37, 0, 0.63, 1) forwards;
    }

    .bottom-flip {
      z-index: 2;
      transform: rotateX(90deg);
      transform-origin: top;
      animation:
        fold-down 280ms cubic-bezier(0.37, 0, 0.63, 1)
        280ms forwards;
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: clamp(18px, 5vw, 28px) 0 0;
      color: var(--caramel);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .date-separator {
      opacity: 0.65;
    }

    @keyframes fold-up {
      from {
        transform: rotateX(0deg);
      }

      to {
        transform: rotateX(-90deg);
      }
    }

    @keyframes fold-down {
      from {
        transform: rotateX(90deg);
      }

      to {
        transform: rotateX(0deg);
      }
    }

    @media (max-width: 360px) {
      .widget {
        padding-inline: 8px;
      }

      .flip-card {
        min-width: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .top-flip,
      .bottom-flip {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="widget">

    <div class="clock" id="clock">

      <div
        class="flip-card"
        id="hours-card"
        data-value="00"
        aria-hidden="true"
      >
        <div class="top">00</div>
        <div class="bottom">00</div>
      </div>

      <div
        class="flip-card"
        id="minutes-card"
        data-value="00"
        aria-hidden="true"
      >
        <div class="top">00</div>
        <div class="bottom">00</div>
      </div>

    </div>

    <p class="date-row">
      <span id="today">08/09</span>
      <span class="date-separator">·</span>
      <span id="week">KW 37</span>
    </p>

  </main>

  <script>
    const TIME_ZONE = "Europe/Berlin";

    const hoursCard =
      document.querySelector("#hours-card");

    const minutesCard =
      document.querySelector("#minutes-card");

    const today =
      document.querySelector("#today");

    const week =
      document.querySelector("#week");

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );

    let initialized = false;

    function getDateParts(now) {
      const parts = new Intl.DateTimeFormat("de-DE", {
        timeZone: TIME_ZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(now);

      return Object.fromEntries(
        parts
          .filter((part) => part.type !== "literal")
          .map((part) => [part.type, part.value])
      );
    }

    function getIsoWeek(year, month, day) {
      const date =
        new Date(Date.UTC(year, month - 1, day));

      const weekday =
        date.getUTCDay() || 7;

      date.setUTCDate(
        date.getUTCDate() + 4 - weekday
      );

      const firstDayOfWeekYear =
        new Date(
          Date.UTC(date.getUTCFullYear(), 0, 1)
        );

      return Math.ceil(
        (
          ((date - firstDayOfWeekYear) / 86400000)
          + 1
        ) / 7
      );
    }

    function setCardImmediately(card, value) {
      card.dataset.value = value;

      card.querySelector(".top").textContent =
        value;

      card.querySelector(".bottom").textContent =
        value;
    }

    function flipTo(card, value) {
      const previous = card.dataset.value;

      if (previous === value) {
        return;
      }

      if (!initialized || reducedMotion.matches) {
        setCardImmediately(card, value);
        return;
      }

      card
        .querySelectorAll(".top-flip, .bottom-flip")
        .forEach((part) => part.remove());

      const top =
        card.querySelector(".top");

      const bottom =
        card.querySelector(".bottom");

      const topFlip =
        document.createElement("div");

      const bottomFlip =
        document.createElement("div");

      topFlip.className = "top-flip";
      bottomFlip.className = "bottom-flip";

      topFlip.textContent = previous;
      bottomFlip.textContent = value;

      card.dataset.value = value;

      topFlip.addEventListener(
        "animationstart",
        () => {
          top.textContent = value;
        }
      );

      topFlip.addEventListener(
        "animationend",
        () => {
          topFlip.remove();
        }
      );

      bottomFlip.addEventListener(
        "animationend",
        () => {
          bottom.textContent = value;
          bottomFlip.remove();
        }
      );

      card.append(topFlip, bottomFlip);
    }

    function updateClock() {
      const now = new Date();
      const parts = getDateParts(now);

      const calendarWeek = getIsoWeek(
        Number(parts.year),
        Number(parts.month),
        Number(parts.day)
      );

      flipTo(
        hoursCard,
        parts.hour.padStart(2, "0")
      );

      flipTo(
        minutesCard,
        parts.minute.padStart(2, "0")
      );

      today.textContent =
        `${parts.day}/${parts.month}`;

      week.textContent =
        `KW ${calendarWeek}`;

      initialized = true;
    }

    updateClock();

    window.setInterval(updateClock, 1000);

    document.addEventListener(
      "visibilitychange",
      updateClock
    );
  </script>
</body>
</html>

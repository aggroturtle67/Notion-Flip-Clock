<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --blau: #70889a;
  --blau-dunkel: #5c7180;
  --creme: #f6efe7;
  --rosa: #c89aa5;
  --caramel: #bd885d;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  background: transparent;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
}

.widget {
  width: 100%;
  padding: 18px;
  text-align: center;
}

.clock {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  perspective: 800px;
}

.card {
  position: relative;
  width: 1.65em;
  padding: 12px 8px;
  border-radius: 14px;
  color: var(--creme);
  background: linear-gradient(
    to bottom,
    var(--blau) 0%,
    var(--blau) 49%,
    var(--blau-dunkel) 51%,
    var(--blau-dunkel) 100%
  );
  box-shadow: 0 10px 22px rgba(0,0,0,.3);
  font-family: Arial, sans-serif;
  font-size: clamp(60px, 20vw, 110px);
  font-weight: bold;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.card::after {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  height: 2px;
  background: rgba(20,25,30,.55);
  content: "";
}

.colon {
  color: var(--rosa);
  font-size: clamp(45px, 12vw, 70px);
}

.flip {
  animation: flip 0.55s ease;
}

@keyframes flip {
  0%   { transform: rotateX(0deg); }
  49%  { transform: rotateX(-90deg); }
  50%  { transform: rotateX(90deg); }
  100% { transform: rotateX(0deg); }
}

.date {
  margin: 22px 0 0;
  color: var(--creme);
  font-size: clamp(15px, 4vw, 20px);
  font-weight: bold;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.week {
  margin: 9px 0 0;
  color: var(--caramel);
  font-family: Arial, sans-serif;
  font-size: clamp(13px, 3vw, 16px);
  font-weight: bold;
  letter-spacing: .18em;
  text-transform: uppercase;
}
</style>
</head>

<body>
<div class="widget">

  <div class="clock">
    <div class="card" id="hours">00</div>
    <div class="colon">:</div>
    <div class="card" id="minutes">00</div>
  </div>

  <p class="date" id="date"></p>
  <p class="week" id="week"></p>

</div>

<script>
const zone = "Europe/Berlin";
const hours = document.getElementById("hours");
const minutes = document.getElementById("minutes");
const dateText = document.getElementById("date");
const weekText = document.getElementById("week");

let firstUpdate = true;

function isoWeek(year, month, day) {
  const date = new Date(Date.UTC(year, month - 1, day));
  const weekday = date.getUTCDay() || 7;

  date.setUTCDate(date.getUTCDate() + 4 - weekday);

  const yearStart =
    new Date(Date.UTC(date.getUTCFullYear(), 0, 1));

  return Math.ceil(
    (((date - yearStart) / 86400000) + 1) / 7
  );
}

function animate(element, value) {
  if (element.textContent === value) return;

  element.textContent = value;

  if (!firstUpdate) {
    element.classList.remove("flip");
    void element.offsetWidth;
    element.classList.add("flip");
  }
}

function updateClock() {
  const now = new Date();

  const parts = Object.fromEntries(
    new Intl.DateTimeFormat("de-DE", {
      timeZone: zone,
      weekday: "long",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    })
    .formatToParts(now)
    .filter(part => part.type !== "literal")
    .map(part => [part.type, part.value])
  );

  const monthName =
    new Intl.DateTimeFormat("de-DE", {
      timeZone: zone,
      month: "long"
    }).format(now);

  animate(hours, parts.hour);
  animate(minutes, parts.minute);

  dateText.textContent =
    `${parts.weekday} · ${parts.day}. ${monthName}`;

  weekText.textContent =
    `KW ${isoWeek(
      Number(parts.year),
      Number(parts.month),
      Number(parts.day)
    )}`;

  firstUpdate = false;
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
